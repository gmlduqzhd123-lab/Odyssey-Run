name: Build and deploy GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Derive the actual Pages base
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          repository_lower="${repository_name,,}"
          owner_lower="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "$repository_lower" == "$owner_lower.github.io" ]]; then
            echo 'PAGES_BASE=/' >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE=/$repository_name/" >> "$GITHUB_ENV"
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
