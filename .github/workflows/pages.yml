name: Build and deploy GitHub Pages
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Derive the actual Pages base
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          repository_lower="${repository_name,,}"
          owner_lower="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "$repository_lower" == "$owner_lower.github.io" ]]; then
            echo 'PAGES_BASE=/' >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE=/$repository_name/" >> "$GITHUB_ENV"
          fi
      - run: npm run build
      - name: Keep the built site for the browser checks
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 3
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  # Browser checks run side by side against the same build; deploy waits for all of them.
  browser:
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: structures
            run: QA_URL="http://localhost:4176$PAGES_BASE" npm run test:structures
          - suite: release
            run: QA_URL="http://localhost:4176$PAGES_BASE" npm run test:release
          - suite: offline
            run: QA_URL="http://localhost:4176$PAGES_BASE" npm run test:offline
          - suite: i18n
            run: QA_URL="http://localhost:4176$PAGES_BASE" npm run test:i18n
          - suite: i18n-vi-zh-ru
            run: for l in vi zh ru; do QA_LANG=$l QA_URL="http://localhost:4176$PAGES_BASE" npm run test:i18n || exit 1; done
          - suite: classroom
            run: QA_URL="http://localhost:4176$PAGES_BASE" npm run test:classroom
          - suite: loading-update
            run: npm run test:loading && npm run test:update
          # Clipped or overlapping text on every menu screen at classroom window sizes.
          - suite: layout-ko-empty
            run: QA_URL="http://localhost:4176$PAGES_BASE" QA_LANGS=ko QA_SAVES=empty npm run test:layout
          - suite: layout-ko-played
            run: QA_URL="http://localhost:4176$PAGES_BASE" QA_LANGS=ko QA_SAVES=played npm run test:layout
          - suite: layout-en-empty
            run: QA_URL="http://localhost:4176$PAGES_BASE" QA_LANGS=en QA_SAVES=empty npm run test:layout
          - suite: layout-en-played
            run: QA_URL="http://localhost:4176$PAGES_BASE" QA_LANGS=en QA_SAVES=played npm run test:layout
          - suite: layout-vi
            run: QA_URL="http://localhost:4176$PAGES_BASE" QA_LANGS=vi QA_SAVES=played npm run test:layout
          - suite: layout-zh
            run: QA_URL="http://localhost:4176$PAGES_BASE" QA_LANGS=zh QA_SAVES=played npm run test:layout
          - suite: layout-ru
            run: QA_URL="http://localhost:4176$PAGES_BASE" QA_LANGS=ru QA_SAVES=played npm run test:layout
    name: browser (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Derive the actual Pages base
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          repository_lower="${repository_name,,}"
          owner_lower="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "$repository_lower" == "$owner_lower.github.io" ]]; then
            echo 'PAGES_BASE=/' >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE=/$repository_name/" >> "$GITHUB_ENV"
          fi
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Serve the built repository subpath
        run: |
          npm run preview -- --port 4176 > /tmp/odyssey-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://localhost:4176$PAGES_BASE" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/odyssey-preview.log
          exit 1
      - name: Run the ${{ matrix.suite }} browser check
        run: ${{ matrix.run }}
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-${{ matrix.suite }}
          if-no-files-found: ignore
          path: |
            artifacts/structures-*
            artifacts/roadmap-chromium-*
            artifacts/roadmap-offline-*
            artifacts/roadmap-update*
            artifacts/roadmap-loading*
            artifacts/roadmap-desktop-home.png
            artifacts/i18n-results.json
            /tmp/odyssey-preview.log
          retention-days: 14
  deploy:
    if: github.event_name != 'pull_request'
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, browser]
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
