name: Build and deploy GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Derive the actual Pages base
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          repository_lower="${repository_name,,}"
          owner_lower="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "$repository_lower" == "$owner_lower.github.io" ]]; then
            echo 'PAGES_BASE=/' >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE=/$repository_name/" >> "$GITHUB_ENV"
          fi
      - run: npm run build
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Serve the built repository subpath
        run: |
          npm run preview -- --port 4176 > /tmp/odyssey-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://localhost:4176$PAGES_BASE" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/odyssey-preview.log
          exit 1
        env:
          PAGES_BASE: ${{ env.PAGES_BASE }}
      - name: Verify mobile play, bosses, daily challenges and save restore
        run: QA_URL="http://localhost:4176$PAGES_BASE" npm run test:release
      - name: Verify downloaded islands with network offline
        run: QA_URL="http://localhost:4176$PAGES_BASE" npm run test:offline
      - name: Verify asset failure recovery and legacy saves
        run: npm run test:loading
      - name: Verify safe multi-tab updates and interrupted downloads
        run: npm run test:update
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: |
            artifacts/roadmap-chromium-*
            artifacts/roadmap-offline-*
            artifacts/roadmap-update*
            artifacts/roadmap-loading*
            artifacts/roadmap-desktop-home.png
            /tmp/odyssey-preview.log
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
